[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathsnap"
version = "0.1.0"
description = "GPS map matching and route reconstruction hackathon project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
api-test = ["httpx>=0.27,<1"]
export = ["packaging>=24"]
inference = ["numpy>=1.26,<3", "scipy>=1.13,<2", "pyproj>=3.6,<4", "scikit-learn>=1.5,<2", "joblib>=1.4,<2", "threadpoolctl>=3,<4"]
optimization = ["optuna>=4,<5"]
models = ["scikit-learn>=1.5,<2", "joblib>=1.4,<2", "threadpoolctl>=3,<4"]
features = ["numpy>=1.26,<3", "scipy>=1.13,<2", "pyproj>=3.6,<4"]
eda = ["numpy>=1.26,<3", "matplotlib>=3.9,<4", "folium>=0.16,<1"]

[tool.setuptools.packages.find]
where = ["src"]
