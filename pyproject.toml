[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathsnap"
version = "0.1.0"
description = "GPS map matching and route reconstruction hackathon project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
eda = ["numpy>=1.26,<3", "matplotlib>=3.9,<4", "folium>=0.16,<1"]

[tool.setuptools.packages.find]
where = ["src"]
